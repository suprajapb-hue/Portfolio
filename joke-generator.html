<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Random Joke Generator</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #f4f4f4;\n            padding: 20px;\n        }\n        #joke {\n            margin: 20px 0;\n            padding: 10px;\n            background-color: white;\n            border: 1px solid #ddd;\n            border-radius: 5px;\n        }\n        button {\n            padding: 10px 15px;\n            background-color: #007BFF;\n            color: white;\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n        }\n        button:hover {\n            background-color: #0056b3;\n        }\n    </style>\n</head>\n<body>\n    <h1>Random Joke Generator</h1>\n    <div id="joke">Click the button to get a joke!</div>\n    <button id="jokeButton">Get a Joke</button>\n\n    <script>\n        async function fetchJoke() {\n            try {\n                const response = await fetch('https://api.jokes.one/jod');\n                const data = await response.json();\n                const joke = data.contents.jokes[0].joke.text;\n                document.getElementById('joke').innerText = joke;\n            } catch (error) {\n                document.getElementById('joke').innerText = 'Could not fetch a joke, please try again.';\n            }\n        }\n\n        document.getElementById('jokeButton').addEventListener('click', fetchJoke);\n    <\/script>\n</body>\n</html>
